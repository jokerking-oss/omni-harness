[project]
name = "omniharness-extension-api"
version = "0.2.1"
description = "Public contracts for OmniHarness extensions"
requires-python = ">=3.12"
# Keep the contract package import-light and independent from the host. Public
# values are stdlib-based; concrete middleware types are validated by OmniHarness.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omniharness_extension_api"]
